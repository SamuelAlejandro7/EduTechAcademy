version: '3.8'

services:
  # Servicio de Base de Datos (Ejemplo con PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: edutech_db_container
    environment:
      POSTGRES_DB: edutech_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Servicio de la Aplicación Principal (API)
  app:
    build: .
    container_name: edutech_app_container
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=edutech_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password_change_me
    depends_on:
      - db

volumes:
  pgdata:
